services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tokenrouter
      POSTGRES_USER: tokenrouter
      POSTGRES_PASSWORD: tokenrouter
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenrouter -d tokenrouter"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: tokenrouter
      DOCKER_INFLUXDB_INIT_BUCKET: usage
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: tokenrouter-demo-token
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - influxdata:/var/lib/influxdb2

volumes:
  pgdata:
  influxdata:
