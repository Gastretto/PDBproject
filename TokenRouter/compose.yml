services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tokenrouter
      POSTGRES_USER: tokenrouter
      POSTGRES_PASSWORD: tokenrouter
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenrouter -d tokenrouter"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
