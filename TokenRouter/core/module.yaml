product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

dependencies:
  - $kotlin.serialization.json
  - $ktor.client.core

dependencies@jvm:
  - $ktor.client.cio

dependencies@android:
  - $ktor.client.okhttp

dependencies@iosArm64:
  - $ktor.client.darwin

dependencies@iosSimulatorArm64:
  - $ktor.client.darwin

dependencies@wasmJs:
  - $libs.ktor.client.js

settings:
  ktor: enabled
  kotlin:
    serialization: enabled
